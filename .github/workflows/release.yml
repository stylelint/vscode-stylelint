name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

defaults:
  run:
    shell: bash

jobs:
  detect:
    # Only run when a release PR is merged.
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-slim

    permissions:
      contents: read

    outputs:
      extension-changed: ${{ steps.check.outputs.extension-changed }}
      server-changed: ${{ steps.check.outputs.server-changed }}
      extension-version: ${{ steps.check.outputs.extension-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: check
        run: |
          EXT_VERSION=$(jq -r '.version' package.json)
          SERVER_VERSION=$(jq -r '.version' packages/language-server/package.json)
          SERVER_NAME=$(jq -r '.name' packages/language-server/package.json)
          echo "extension-version=${EXT_VERSION}" >> "${GITHUB_OUTPUT}"

          # A package needs releasing if its version tag doesn't already exist.
          EXT_CHANGED=false
          SERVER_CHANGED=false

          if ! git tag --list "${EXT_VERSION}" | grep -q .; then
            EXT_CHANGED=true
          fi

          if ! git tag --list "${SERVER_NAME}@${SERVER_VERSION}" | grep -q .; then
            SERVER_CHANGED=true
          fi

          echo "extension-changed=${EXT_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "server-changed=${SERVER_CHANGED}" >> "${GITHUB_OUTPUT}"

          echo "Extension ${EXT_VERSION}: changed=${EXT_CHANGED}"
          echo "Server ${SERVER_VERSION}: changed=${SERVER_CHANGED}"

  release-extension:
    needs: detect
    if: needs.detect.outputs.extension-changed == 'true'

    runs-on: ubuntu-latest

    environment: npm
    concurrency: npm

    permissions:
      contents: write

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*' # TODO: Switch to node-version-file because npm v12.0.0 requires Node.js v22.22.2 or later.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to VS Code Marketplace
        run: npm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create draft GitHub release
        uses: stylelint/changelog-to-github-release-action@fa1228a5ad2a0089273852a32261ca1b3efda395 # 0.6.0
        with:
          tag: ${{ needs.detect.outputs.extension-version }}
          name: 'vscode-stylelint ${{ needs.detect.outputs.extension-version }}'
          draft: true

      - name: Attach VSIX to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.extension-version }}
          VSIX: ${{ runner.temp }}/vscode-stylelint-${{ needs.detect.outputs.extension-version }}.vsix
        run: |
          npx @vscode/vsce package --out "${VSIX}"
          gh release upload "${TAG}" "${VSIX}"

  release-server:
    needs: detect
    if: needs.detect.outputs.server-changed == 'true'
    uses: stylelint/.github/.github/workflows/call-release.yml@c7bd02a469ce20d1f3a35b7561b99262cba9a683 # 2.0.0
    with:
      workspace: '@stylelint/language-server'
      node-version: 'lts/*' # TODO: Switch to node-version-file because npm v12.0.0 requires Node.js v22.22.2 or later.
      publish-npm-staged: true
    permissions:
      contents: write
      id-token: write
