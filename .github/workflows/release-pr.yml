name: Release PR

on:
  workflow_dispatch:

jobs:
  release-pr:
    # Prevent this action from running on forks.
    if: github.repository == 'stylelint/vscode-stylelint'
    uses: stylelint/.github/.github/workflows/call-release-pr.yml@release-pr-packages # TODO: Change to a published version.
    with:
      new-version-command: 'npm run changeset'
    permissions:
      contents: write
      pull-requests: write
