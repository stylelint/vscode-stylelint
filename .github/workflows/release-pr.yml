name: Release PR

on:
  workflow_dispatch:

jobs:
  release-pr:
    # Prevent this action from running on forks.
    if: github.repository == 'stylelint/vscode-stylelint'
    uses: stylelint/.github/.github/workflows/call-release-pr.yml@c7bd02a469ce20d1f3a35b7561b99262cba9a683 # 2.0.0
    with:
      new-version-command: 'npm run changeset'
    permissions:
      contents: write
      pull-requests: write
